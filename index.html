<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obrigado — Brás Conect</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #151a28;
      --bg2:      #1a1f2e;
      --surface:  #1f2539;
      --surface2: #242b40;
      --gold:     #c9a84c;
      --gold-lt:  #e8c97a;
      --gold-dk:  #a07830;
      --text:     #f0ece4;
      --muted:    #8a8fa8;
      --border:   rgba(201,168,76,0.18);
      --border2:  rgba(201,168,76,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Jost', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Noise */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      background-size: 180px;
      pointer-events: none; z-index: 0;
    }

    /* Gold blobs */
    .blob {
      position: fixed; border-radius: 50%;
      filter: blur(130px); pointer-events: none; z-index: 0;
    }
    .blob-1 {
      width: 460px; height: 460px;
      background: radial-gradient(circle, rgba(201,168,76,0.09), transparent 70%);
      top: -80px; right: -80px;
      animation: drift 14s ease-in-out infinite alternate;
    }
    .blob-2 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(232,201,122,0.06), transparent 70%);
      bottom: 15%; left: -60px;
      animation: drift 18s ease-in-out infinite alternate-reverse;
    }
    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(25px,35px) scale(1.1); }
    }

    /* Wrapper */
    .wrapper {
      position: relative; z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 16px 80px;
      display: flex; flex-direction: column;
      align-items: center; gap: 32px;
    }

    /* Logo */
    .logo-area {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      opacity: 0; animation: fadeUp 0.6s 0.1s ease forwards;
    }
    .logo-icon {
      width: 64px; height: 64px;
      background: linear-gradient(145deg, var(--gold-dk), var(--gold), var(--gold-lt));
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 30px rgba(201,168,76,0.25), inset 0 1px 0 rgba(255,255,255,0.1);
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px; font-weight: 600;
      color: var(--bg);
    }
    .logo-name {
      font-family: 'Jost', sans-serif;
      font-size: 13px; font-weight: 600;
      letter-spacing: 0.25em;
      color: var(--gold);
      text-transform: uppercase;
    }
    .logo-sub {
      font-size: 10px; letter-spacing: 0.3em;
      color: var(--muted); text-transform: uppercase;
    }

    /* Ornament line */
    .ornament {
      display: flex; align-items: center; gap: 14px;
      width: 100%; max-width: 320px;
      opacity: 0; animation: fadeUp 0.5s 0.3s ease forwards;
    }
    .ornament-line {
      flex: 1; height: 1px;
      background: linear-gradient(to right, transparent, var(--border), transparent);
    }
    .ornament-diamond {
      width: 7px; height: 7px;
      background: var(--gold);
      transform: rotate(45deg);
      box-shadow: 0 0 10px rgba(201,168,76,0.5);
    }

    /* Hero */
    .hero {
      text-align: center;
      opacity: 0; animation: fadeUp 0.7s 0.4s ease forwards;
    }
    .hero-eyebrow {
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 16px;
    }
    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(44px, 9vw, 78px);
      font-weight: 400; line-height: 1.05;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .hero h1 em {
      font-style: italic; color: var(--gold-lt);
    }
    .hero p {
      margin-top: 20px;
      font-size: 16px; font-weight: 300;
      color: var(--muted); line-height: 1.7;
      max-width: 500px; margin-inline: auto;
    }

    /* Video card */
    .video-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 2px 0 rgba(201,168,76,0.2),
        0 30px 80px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.04);
      opacity: 0; animation: fadeUp 0.8s 0.6s ease forwards;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .video-card:hover {
      transform: translateY(-5px);
      box-shadow:
        0 2px 0 rgba(201,168,76,0.3),
        0 40px 100px rgba(0,0,0,0.65),
        0 0 50px rgba(201,168,76,0.06);
    }

    .video-header {
      padding: 16px 22px;
      border-bottom: 1px solid var(--border2);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface2);
    }
    .vid-label {
      font-size: 12px; font-weight: 500;
      color: var(--muted); letter-spacing: 0.08em;
    }
    .vid-badge {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--gold);
      background: rgba(201,168,76,0.1);
      border: 1px solid rgba(201,168,76,0.2);
      padding: 3px 10px; border-radius: 100px;
    }

    .video-wrapper {
      position: relative; width: 100%; aspect-ratio: 9/16;
      background: #0e1118;
    }
    .video-wrapper iframe,
    .video-wrapper video {
      position: absolute; inset: 0;
      width: 100%; height: 100%; border: none;
    }

    .video-placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background: linear-gradient(145deg, #0e1118, #151a28);
    }
    .play-btn {
      width: 76px; height: 76px;
      background: linear-gradient(135deg, var(--gold-dk), var(--gold), var(--gold-lt));
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 12px rgba(201,168,76,0.08), 0 8px 40px rgba(201,168,76,0.3);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .play-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 0 16px rgba(201,168,76,0.1), 0 12px 50px rgba(201,168,76,0.45);
    }
    .play-btn svg { margin-left: 5px; }
    .placeholder-label {
      font-size: 13px; color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* Steps */
    .steps {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      opacity: 0; animation: fadeUp 0.8s 0.85s ease forwards;
    }
    .step {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 14px;
      padding: 26px 22px;
      position: relative; overflow: hidden;
      transition: border-color 0.25s, transform 0.25s;
    }
    .step::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      opacity: 0; transition: opacity 0.25s;
    }
    .step:hover { border-color: var(--border); transform: translateY(-4px); }
    .step:hover::before { opacity: 1; }
    .step-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 40px; font-weight: 600;
      color: var(--gold); line-height: 1;
      margin-bottom: 14px; opacity: 0.8;
    }
    .step h3 {
      font-size: 14px; font-weight: 600;
      color: var(--text); margin-bottom: 8px;
      letter-spacing: 0.03em;
    }
    .step p {
      font-size: 13px; font-weight: 300;
      color: var(--muted); line-height: 1.6;
    }

    /* CTA */
    .cta-area {
      text-align: center;
      opacity: 0; animation: fadeUp 0.8s 1.05s ease forwards;
    }
    .cta-area p {
      font-size: 14px; color: var(--muted);
      margin-bottom: 22px; letter-spacing: 0.04em;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 12px;
      background: linear-gradient(135deg, var(--gold-dk) 0%, var(--gold) 50%, var(--gold-lt) 100%);
      color: #111520;
      font-family: 'Jost', sans-serif;
      font-size: 14px; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 15px 36px;
      border-radius: 100px;
      text-decoration: none; border: none; cursor: pointer;
      box-shadow: 0 4px 24px rgba(201,168,76,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 36px rgba(201,168,76,0.45), inset 0 1px 0 rgba(255,255,255,0.2);
    }

    /* Footer line */
    .footer-line {
      font-size: 12px; color: var(--muted);
      letter-spacing: 0.1em; text-transform: uppercase;
      opacity: 0; animation: fadeUp 0.6s 1.2s ease forwards;
    }
    .footer-line span { color: var(--gold); margin: 0 6px; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 500px) {
      .steps { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="wrapper">


    <!-- Hero -->
    <div class="hero">
      
      <h1>Obrigado pela<br><em>sua confiança</em></h1>
      <p><span style="display:inline-flex;align-items:center;gap:8px;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.3);border-radius:10px;padding:10px 14px;font-size:14px;color:#f0ece4;line-height:1.5;"><svg style="flex-shrink:0;animation:blink 1.2s ease-in-out infinite;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span><strong style="color:#e8c97a;">Atenção:</strong> antes de acessar o APP assista o vídeo abaixo.</span></span></p>
<style>@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }</style>
    </div>

    <!-- Video -->
    <div class="video-card">
      <div class="video-wrapper" style="position:relative;cursor:pointer;" onclick="togglePlay(this)">
        <video
          id="mainVideo"
          src="tutorial.mp4"
          oncontextmenu="return false"
          style="position:absolute;inset:0;width:100%;height:100%;background:#0e1118;">
        </video>
        <div id="playOverlay" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.35);transition:opacity 0.3s;">
          <div style="position:relative;display:flex;align-items:center;justify-content:center;">
            <span style="position:absolute;width:80px;height:80px;border-radius:50%;background:rgba(201,168,76,0.35);animation:pulseRing 1.8s ease-out infinite;"></span>
            <span style="position:absolute;width:80px;height:80px;border-radius:50%;background:rgba(201,168,76,0.2);animation:pulseRing 1.8s ease-out infinite 0.6s;"></span>
            <div style="width:68px;height:68px;background:linear-gradient(135deg,#a07830,#c9a84c,#e8c97a);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(201,168,76,0.5);position:relative;z-index:1;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="#111520"><polygon points="5,3 19,12 5,21"/></svg>
            </div>
          </div>
        </div>
        <style>
          @keyframes pulseRing {
            0%   { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1.8); opacity: 0; }
          }
        </style>
        <div style="position:absolute;bottom:0;left:0;right:0;padding:10px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,0.7));">
          <div onclick="event.stopPropagation()" style="display:flex;align-items:center;gap:10px;">
            <span id="curTime" style="font-size:11px;color:#f0ece4;min-width:32px;font-family:Jost,sans-serif;">0:00</span>
            <div id="progressBar" onclick="seekVideo(event)" style="flex:1;height:3px;background:rgba(255,255,255,0.2);border-radius:2px;cursor:pointer;position:relative;">
              <div id="progressFill" style="height:100%;width:0%;background:linear-gradient(to right,#a07830,#e8c97a);border-radius:2px;pointer-events:none;"></div>
            </div>
            <span id="durTime" style="font-size:11px;color:#f0ece4;min-width:32px;text-align:right;font-family:Jost,sans-serif;">0:00</span>
            <div onclick="toggleMute()" style="cursor:pointer;padding:2px;">
              <svg id="muteIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f0ece4" stroke-width="2" stroke-linecap="round"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path id="volLine2" d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            </div>
          </div>
        </div>
      </div>
      <script>
        var vid = document.getElementById('mainVideo');
        var overlay = document.getElementById('playOverlay');
        var playIcon = document.getElementById('playIcon');
        var progressFill = document.getElementById('progressFill');
        var curTime = document.getElementById('curTime');
        var durTime = document.getElementById('durTime');
        var muted = false;
        function fmt(s){ var m=Math.floor(s/60); var sec=Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }
        function togglePlay(el){
          if(vid.paused){ vid.play(); overlay.style.opacity='0'; overlay.style.pointerEvents='none'; }
          else { vid.pause(); overlay.style.opacity='1'; overlay.style.pointerEvents='auto'; }
        }
        vid.addEventListener('timeupdate', function(){
          if(vid.duration){ progressFill.style.width=(vid.currentTime/vid.duration*100)+'%'; curTime.textContent=fmt(vid.currentTime); }
        });
        vid.addEventListener('loadedmetadata', function(){ durTime.textContent=fmt(vid.duration); });
        vid.addEventListener('ended', function(){ overlay.style.opacity='1'; overlay.style.pointerEvents='auto'; });
        function seekVideo(e){
          var bar = document.getElementById('progressBar');
          var rect = bar.getBoundingClientRect();
          var pct = (e.clientX - rect.left) / rect.width;
          vid.currentTime = pct * vid.duration;
        }
        function toggleMute(){
          muted = !muted;
          vid.muted = muted;
          document.getElementById('volLine2').style.display = muted ? 'none' : '';
        }
      </script>
    </div>

    <!-- CTA -->
    <div class="cta-area">
      <a href="https://app.brasconect.shop" class="btn">
        Acessar o app
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12,5 19,12 12,19"/>
        </svg>
      </a>
    </div>

    <!-- Footer -->


  </div>

</body>
</html>
